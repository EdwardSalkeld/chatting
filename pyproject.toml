[project]
name = "chatting"
version = "0.1.0"
description = "Split-mode task orchestration for Codex-driven workflows."
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.2.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.5",
]

[tool.ruff]
target-version = "py314"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
